<ion-app>
    <ion-split-pane when="sm" contentId="main">
        <ion-menu side="start" contentId="main">
            @if (user$ | async; as user) {
                <ion-header class="menu-header">
                    <div class="menu-profile">
                        <ion-avatar class="menu-avatar">
                            <img [src]="user.image || 'assets/img/playerAvatar.png'" appSafeImage alt="">
                        </ion-avatar>
                        <div class="menu-user">
                            <span class="menu-nickname">{{ user.nickname }}</span>
                            <span class="menu-email">{{ user.email }}</span>
                        </div>
                    </div>
                </ion-header>
            }
            <ion-content class="menu-content">
                <ion-list lines="none" class="menu-list">
                    <ion-item button (click)="editNickname()">
                        <ion-icon name="create-outline" slot="start" aria-hidden="true"></ion-icon>
                        <ion-label>Cambiar apodo</ion-label>
                    </ion-item>
                    <ion-item button [routerLink]="['/about']">
                        <ion-icon name="information-circle-outline" slot="start" aria-hidden="true"></ion-icon>
                        <ion-label>Info de la app</ion-label>
                    </ion-item>
                </ion-list>
            </ion-content>

            <ion-footer class="menu-footer">
                <ion-item button lines="none" class="logout-item" (click)="confirmLogout()">
                    <ion-icon name="log-out-outline" slot="start" aria-hidden="true"></ion-icon>
                    <ion-label>Cerrar sesión</ion-label>
                </ion-item>
            </ion-footer>
        </ion-menu>
        <ion-router-outlet id="main"></ion-router-outlet>
    </ion-split-pane>

    @if (loadingService.visible()) {
        <div class="app-loader" role="status" aria-live="polite">
            <app-logo-mark [animated]="true" class="app-loader-mark" label="Cargando" />
            <p>{{ loadingService.message() }}</p>
        </div>
    }
</ion-app>
