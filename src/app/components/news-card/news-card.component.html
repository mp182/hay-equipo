@if (news()?.length) {
  <ion-card>
    <ion-card-header>
      <ion-card-title>
        <ion-icon name="newspaper-outline"></ion-icon>
        Novedades
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      @for (item of news(); track item.id) {
        <ion-item lines="none">
          <ion-icon name="information-circle" slot="start"></ion-icon>
          <ion-text>{{ item.description }}</ion-text>
          @if (deleting() === item.id) {
            <ion-spinner slot="end" name="lines-small"></ion-spinner>
          } @else if (admin()) {
            <ion-button slot="end" color="danger" shape="round" (click)="delete(item.id)">
              <ion-icon slot="icon-only" name="close"></ion-icon>
            </ion-button>
          }
        </ion-item>
      }
    </ion-card-content>
  </ion-card>
}
