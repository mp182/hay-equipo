<ion-header>
  <ion-toolbar color="secondary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Cambiar Equipos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-reorder-group (ionReorderEnd)="doReorder($event)" [disabled]="false">
    @for (item of reorderItems(); track item.id) {
      <ion-item>
        @if (item.flag) {
          <ion-label class="ion-text-center team-flag">
            <strong>{{ item.nickname }}</strong>
          </ion-label>
        } @else {
          <ion-label>{{ item.nickname }}</ion-label>
          <ion-reorder slot="end"></ion-reorder>
        }
      </ion-item>
    }
  </ion-reorder-group>
</ion-content>

@if (canSave()) {
  <ion-footer>
    <ion-toolbar color="warning" mode="ios" (click)="changeTeams()">
      <ion-title>Guardar</ion-title>
    </ion-toolbar>
  </ion-footer>
}
