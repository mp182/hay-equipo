<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <app-back-button [fallback]="'/match/' + matchId" />
    </ion-buttons>
    <ion-title>Cambiar equipos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-body">
    <p class="page-intro">Arrastrá a los jugadores desde el ícono de la derecha para pasarlos de un equipo al otro.</p>

    <ion-list class="rounded-list" lines="full">
      <ion-reorder-group (ionReorderEnd)="doReorder($event)" [disabled]="false">
        @for (item of reorderItems(); track item.id) {
          @if (item.flag) {
            <ion-item class="team-flag" [class.shirt-white]="item.id === '__white'" [class.shirt-black]="item.id === '__black'">
              <ion-label>{{ item.nickname }}</ion-label>
            </ion-item>
          } @else {
            <ion-item>
              <ion-label>{{ item.nickname }}</ion-label>
              <ion-reorder slot="end"></ion-reorder>
            </ion-item>
          }
        }
      </ion-reorder-group>
    </ion-list>
  </div>
</ion-content>

@if (canSave()) {
  <ion-footer class="actions-footer">
    <div class="actions">
      <ion-button class="big-button" expand="block" (click)="changeTeams()">
        Guardar cambios
      </ion-button>
    </div>
  </ion-footer>
}
