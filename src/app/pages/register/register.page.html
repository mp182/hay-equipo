<ion-header>
    <ion-toolbar color="primary">
        <ion-buttons slot="start">
            <ion-back-button defaultHref="login"></ion-back-button>
        </ion-buttons>
        <ion-title>Crear Cuenta</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <form class="form" [formGroup]="registerForm" (ngSubmit)="register()">

        <ion-item>
            <ion-input label="Nombre | Apodo" labelPlacement="floating" color="primary" type="text"
                formControlName="nickname"></ion-input>
        </ion-item>

        <ion-item>
            <ion-input label="Email" labelPlacement="floating" color="primary" type="email" autocomplete="email"
                formControlName="email"></ion-input>
        </ion-item>

        <ion-item>
            <ion-input label="Contraseña" labelPlacement="floating" color="primary" type="password"
                autocomplete="new-password" formControlName="password"></ion-input>
        </ion-item>

        <ion-button class="ion-margin-vertical" type="submit" [disabled]="registerForm.invalid" expand="block">
            Crear
        </ion-button>
    </form>

    <p>
        Ya tenés una cuenta? <a class="link" routerLink="/login">Ingresá con tu cuenta.</a>
    </p>

</ion-content>
