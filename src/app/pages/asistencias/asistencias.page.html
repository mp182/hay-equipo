<ion-content>
    <ion-grid fixed>
        <ion-card>
            <ion-card-header>
                <ion-card-subtitle>Referencia</ion-card-subtitle>
            </ion-card-header>
            <ion-item>
                <ion-avatar slot="start">
                    <img src="assets/img/playerAvatar.png" alt="Avatar">
                </ion-avatar>
                <h5> Nombre </h5>
                <h4 slot="end">
                    <ion-badge color="primary" class="ion-margin-end"> P. Jugados </ion-badge>
                </h4>
            </ion-item>
            <ion-card-content>
                Solo aparecen jugadores con 10 partidos jugados o más.
            </ion-card-content>
        </ion-card>

        <ion-list>
            @for (player of players(); track player.id) {
            <ion-item>
                <ion-avatar slot="start">
                    <img [src]="player.image || 'assets/img/playerAvatar.png'" appSafeImage alt="Avatar">
                </ion-avatar>
                <h6>{{player.nickname}}</h6>
                <h4 slot="end">
                    <ion-badge color="primary" class="ion-margin-end">{{ player.played }}</ion-badge>
                </h4>
            </ion-item>
            }
        </ion-list>
    </ion-grid>
</ion-content>
