<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Info de la app</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-body">
    <section class="app-card">
      <app-logo-mark class="app-logo" />
      <h1 class="app-name">Hay Equipo!</h1>
      <p class="app-tagline">Organizá el fulbito con tus amigos</p>
      <p class="app-version">Versión {{ version }}</p>
    </section>

    <h2 class="section-title">¿Quién la hizo?</h2>
    <section class="author">
      <ion-avatar class="author-avatar">
        <img src="assets/img/about-1.jpg" appSafeImage alt="">
      </ion-avatar>
      <div class="author-info">
        <strong>Pablo</strong>
        <span>Desarrollador de software</span>
        <div class="author-links">
          <ion-button size="small" fill="outline" href="https://www.linkedin.com/in/pablo-mancinelli/" target="_blank">
            LinkedIn
          </ion-button>
          <ion-button size="small" fill="outline" href="https://github.com/mp182" target="_blank">
            GitHub
          </ion-button>
        </div>
      </div>
    </section>
  </div>
</ion-content>
