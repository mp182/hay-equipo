<ion-content class="ion-padding">
    <div class="login-container">

        <ion-grid fixed>

            <ion-row class="ion-justify-content-center">
                <ion-col size-md="8">
                    <img src="assets/img/appicon.png" class="login-logo" alt="Hay Equipo!">
                </ion-col>
            </ion-row>

            <form class="ion-margin-vertical" [formGroup]="loginForm" (ngSubmit)="loginUser()">

                <ion-item>
                    <ion-input label="Email" labelPlacement="floating" color="primary" type="email"
                        autocomplete="email" formControlName="email"></ion-input>
                </ion-item>

                <ion-item>
                    <ion-input label="Contraseña" labelPlacement="floating" color="primary" type="password"
                        autocomplete="current-password" formControlName="password"></ion-input>
                </ion-item>

                <ion-button class="ion-margin-vertical" type="submit" [disabled]="loginForm.invalid" expand="block">
                    Ingresar
                </ion-button>

                <ion-button type="button" (click)="loginWithGoogle()" expand="block"
                    class="login-google-button ion-margin-vertical">
                    <img src="assets/img/g-logo.png" class="g-logo" alt="">
                    Ingresar con Google
                </ion-button>

                <p class="error-message">{{ errorMessage() }}</p>
            </form>

            <br>

            <p>
                No tenés cuenta? <a class="link" routerLink="/register">Crear una cuenta.</a>
            </p>

            <p>
                Olvidaste tu contraseña? <a class="link" routerLink="/reset-password">Recuperar contraseña.</a>
            </p>

        </ion-grid>

    </div>
</ion-content>
