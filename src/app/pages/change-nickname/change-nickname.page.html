<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="dashboard"></ion-back-button>
        </ion-buttons>
        <ion-title>Cambiar Apodo</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <ion-grid fixed>
        <ion-item>
            <ion-input label="Nuevo Apodo" labelPlacement="floating" type="text" [formControl]="nickname"></ion-input>
        </ion-item>
        <ion-button [disabled]="nickname.invalid" expand="block" class="ion-margin-vertical"
            (click)="updateNickname()">
            OK
        </ion-button>
    </ion-grid>
</ion-content>
