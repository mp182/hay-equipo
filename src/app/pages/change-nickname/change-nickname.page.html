<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <app-back-button />
        </ion-buttons>
        <ion-title>Cambiar apodo</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>
    <form class="page-body form-stack" (submit)="$event.preventDefault(); nickname.valid && updateNickname()">
        <ion-input label="Nuevo apodo" labelPlacement="floating" fill="outline" type="text"
            [formControl]="nickname"></ion-input>
        <p class="form-hint">Es el nombre que ven todos en los partidos y el ranking. Mínimo 3 letras.</p>
        <ion-button class="big-button" type="submit" expand="block" [disabled]="nickname.invalid">
            Guardar
        </ion-button>
    </form>
</ion-content>
