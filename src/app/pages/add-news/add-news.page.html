<ion-header>
  <ion-toolbar>
      <ion-buttons slot="start">
          <app-back-button />
      </ion-buttons>
      <ion-title>Nueva info</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form class="page-body form-stack" [formGroup]="newsForm" (ngSubmit)="addNews()">

    <p class="page-intro">Aparece en la tarjeta de Novedades del inicio, para todos.</p>

    <ion-input label="Texto" labelPlacement="floating" fill="outline" type="text"
      formControlName="description"></ion-input>

    <ion-button class="big-button" type="submit" expand="block" [disabled]="newsForm.invalid">
      Publicar
    </ion-button>

  </form>
</ion-content>
