<ion-header>
  <ion-toolbar color="primary">
      <ion-buttons slot="start">
          <ion-back-button defaultHref="dashboard"></ion-back-button>
      </ion-buttons>
      <ion-title>Agregar Novedad</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form class="form" [formGroup]="newsForm" (ngSubmit)="addNews()">

      <ion-item>
          <ion-input label="Descripción" labelPlacement="floating" color="primary" type="text"
              formControlName="description"></ion-input>
      </ion-item>

      <ion-button class="ion-margin-vertical" type="submit" expand="block" [disabled]="newsForm.invalid">
          Agregar
      </ion-button>

  </form>
</ion-content>
