<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Nuevo amigo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form class="form" [formGroup]="newFriendForm" (ngSubmit)="saveFriend()">

      <ion-item>
          <ion-input label="Nombre | Apodo" labelPlacement="floating" color="primary" type="text"
              formControlName="nickname"></ion-input>
      </ion-item>

      <ion-button type="submit" [disabled]="newFriendForm.invalid" expand="block" class="ion-margin-vertical">
          OK
      </ion-button>

  </form>
</ion-content>
