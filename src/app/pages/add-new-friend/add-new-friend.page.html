<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Nuevo amigo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form class="page-body form-stack" [formGroup]="newFriendForm" (ngSubmit)="saveFriend()">

    <p class="page-intro">Para un amigo que no usa la app. Queda anotado en este partido.</p>

    <ion-input label="Nombre o apodo" labelPlacement="floating" fill="outline" type="text"
      formControlName="nickname"></ion-input>

    <ion-button class="big-button" type="submit" [disabled]="newFriendForm.invalid" expand="block">
      Anotarlo
    </ion-button>

  </form>
</ion-content>
