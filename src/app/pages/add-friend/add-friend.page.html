<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Anotá a un amigo</ion-title>
    <ion-buttons slot="secondary">
      <ion-menu-button [autoHide]="false"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-searchbar placeholder="Buscar..." [animated]="true" (ionInput)="filterList($event)"></ion-searchbar>

  @if (filteredList().length > 0) {
    <ion-list>
      @for (player of filteredList(); track player.id) {
        <ion-item button (click)="addFriendAlert(player)">
          <ion-avatar slot="start">
            <img [src]="player.image || 'assets/img/playerAvatar.png'" appSafeImage alt="Avatar">
          </ion-avatar>
          <h6>{{ player.nickname }}</h6>
          <div class="flex-container" slot="end">
            <ion-badge color="primary" class="ion-margin-end">{{ player.played }}</ion-badge>
            <ion-badge color="success" class="ion-margin-end">{{ player.won }}</ion-badge>
            <h5>
              <app-score [player]="player"></app-score>
            </h5>
          </div>
        </ion-item>
      }
    </ion-list>
  }

</ion-content>

<ion-footer>
  <ion-toolbar color="secondary" (click)="addNewFriend()">
    <ion-title>Nuevo amigo ✨</ion-title>
  </ion-toolbar>
</ion-footer>
