<ion-header>
    <ion-toolbar color="primary">
        <ion-buttons slot="start">
            <ion-back-button defaultHref="dashboard"></ion-back-button>
        </ion-buttons>
        <ion-title>Agregar Partido</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <form class="form" [formGroup]="matchForm" (ngSubmit)="addMatch()">

        <ion-item>
            <ion-label color="primary">Fecha y hora</ion-label>
            <ion-datetime-button datetime="match-date" slot="end"></ion-datetime-button>
        </ion-item>

        <ion-modal [keepContentsMounted]="true">
            <ng-template>
                <ion-datetime id="match-date" formControlName="date" presentation="date-time" locale="es-AR"
                    [firstDayOfWeek]="1" hourCycle="h23" [showDefaultButtons]="true" cancelText="Cancelar"
                    doneText="Aceptar"></ion-datetime>
            </ng-template>
        </ion-modal>

        <ion-item>
            <ion-select label="Cantidad de Jugadores" labelPlacement="floating" color="primary"
                formControlName="maxPlayers" interface="action-sheet" cancelText="Cancelar"
                [interfaceOptions]="maxPlayerOptions">
                <ion-select-option [value]="12">12</ion-select-option>
                <ion-select-option [value]="10">10</ion-select-option>
            </ion-select>
        </ion-item>

        <ion-item>
            <ion-input label="Lugar" labelPlacement="floating" color="primary" type="text"
                formControlName="location"></ion-input>
        </ion-item>

        <ion-button class="ion-margin-vertical" type="submit" expand="block" [disabled]="matchForm.invalid">
            Agregar
        </ion-button>

    </form>
</ion-content>
