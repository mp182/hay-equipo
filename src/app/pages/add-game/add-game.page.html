<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <app-back-button />
        </ion-buttons>
        <ion-title>Nuevo partido</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>
    <form class="page-body form-stack" [formGroup]="matchForm" (ngSubmit)="addMatch()">

        <div class="field-row">
            <span>Fecha y hora</span>
            <ion-datetime-button datetime="match-date"></ion-datetime-button>
        </div>

        <ion-modal [keepContentsMounted]="true">
            <ng-template>
                <ion-datetime id="match-date" formControlName="date" presentation="date-time" locale="es-AR"
                    [firstDayOfWeek]="1" hourCycle="h23" [showDefaultButtons]="true" cancelText="Cancelar"
                    doneText="Aceptar"></ion-datetime>
            </ng-template>
        </ion-modal>

        <ion-select label="Cantidad de jugadores" labelPlacement="floating" fill="outline"
            formControlName="maxPlayers" interface="action-sheet" cancelText="Cancelar"
            [interfaceOptions]="maxPlayerOptions">
            <ion-select-option [value]="12">12 (6 contra 6)</ion-select-option>
            <ion-select-option [value]="10">10 (5 contra 5)</ion-select-option>
        </ion-select>

        <ion-input label="Lugar" labelPlacement="floating" fill="outline" type="text"
            formControlName="location"></ion-input>

        <ion-button class="big-button" type="submit" expand="block" [disabled]="matchForm.invalid">
            Crear partido
        </ion-button>

    </form>
</ion-content>
