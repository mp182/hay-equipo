<ion-header>
    <ion-toolbar color="primary">
        <ion-buttons slot="start">
            <ion-back-button defaultHref="login"></ion-back-button>
        </ion-buttons>
        <ion-title>Recuperar Contraseña</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <form class="form" [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()">
        <ion-item>
            <ion-input label="Email" labelPlacement="floating" color="primary" type="email" autocomplete="email"
                formControlName="email"></ion-input>
        </ion-item>

        <ion-button class="ion-margin-vertical" type="submit" [disabled]="resetPasswordForm.invalid" expand="block">
            Enviar
        </ion-button>
    </form>
</ion-content>
