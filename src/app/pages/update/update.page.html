<ion-header>
    <ion-toolbar>
        <ion-title>Novedades</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>
    <div class="page-body">
        @for (entry of entries(); track entry.version) {
            <section class="release">
                <p class="release-version">Versión {{ entry.version }}</p>
                <h2 class="release-title">Qué hay de nuevo</h2>
                <ul class="release-changes">
                    @for (change of entry.changes; track $index) {
                        <li>
                            <ion-icon name="football" aria-hidden="true"></ion-icon>
                            <span>{{ change }}</span>
                        </li>
                    }
                </ul>
            </section>
        }

        <ion-button class="big-button" expand="block" (click)="close()">
            Dale!
        </ion-button>
    </div>
</ion-content>
