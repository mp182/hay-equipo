<ion-header>
    <ion-toolbar>
        <ion-title>Novedades</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>

    @for (entry of entries(); track entry.version) {
        <ion-card>
            <ion-card-header>
                <ion-card-subtitle>Versión {{ entry.version }}</ion-card-subtitle>
                <ion-card-title>✨ Qué hay de nuevo</ion-card-title>
            </ion-card-header>

            <ion-card-content>
                <ion-list>
                    @for (change of entry.changes; track $index) {
                        <ion-item class="ion-margin-vertical ion-text-justify" lines="none">
                            <ion-icon name="football" slot="start"></ion-icon>
                            <p>{{ change }}</p>
                        </ion-item>
                    }
                </ion-list>
            </ion-card-content>
        </ion-card>
    }

    <ion-button class="ion-padding" expand="block" (click)="close()">
        Dale!
    </ion-button>

</ion-content>
